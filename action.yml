name: pydepaudit
description: >-
  Audit Python dependencies for vulnerabilities, licenses, staleness and
  maintainer health.
author: MathiasPaulenko
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Path to the project to audit.
    required: false
    default: "."
  fail-on:
    description: Fail the step on findings at this severity or above.
    required: false
    default: ""
  format:
    description: "Output format: table, json or sarif."
    required: false
    default: table
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
    - name: Install pydepaudit
      shell: bash
      run: pip install pydepaudit
    - name: Audit dependencies
      shell: bash
      env:
        PYDEPAUDIT_PATH: ${{ inputs.path }}
        PYDEPAUDIT_FORMAT: ${{ inputs.format }}
        PYDEPAUDIT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(check "$PYDEPAUDIT_PATH" --format "$PYDEPAUDIT_FORMAT")
        if [ -n "$PYDEPAUDIT_FAIL_ON" ]; then
          args+=(--fail-on "$PYDEPAUDIT_FAIL_ON")
        fi
        pydepaudit "${args[@]}"
