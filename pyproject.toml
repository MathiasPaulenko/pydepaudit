[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydepaudit"
dynamic = ["version"]
description = "Audit Python dependencies for CVEs, licenses, staleness and maintainer health in one command."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mathias Paulenko" }]
keywords = ["dependencies", "audit", "security", "supply-chain", "cve", "license", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "packaging>=24.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
pydepaudit = "pydepaudit.cli:app"

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/pydepaudit"
Repository = "https://github.com/MathiasPaulenko/pydepaudit"
Issues = "https://github.com/MathiasPaulenko/pydepaudit/issues"
Changelog = "https://github.com/MathiasPaulenko/pydepaudit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "pydepaudit/__init__.py"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
